<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBot — AI Fitness Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="noise"></div>

  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">FitBot</span>
    </div>

    <div class="sidebar-label">QUICK TOPICS</div>
    <div class="chips">
      <button class="chip" onclick="quickSend('How do I lose weight fast?')">Fat Loss</button>
      <button class="chip" onclick="quickSend('How do I build muscle?')">Muscle Gain</button>
      <button class="chip" onclick="quickSend('Give me a diet plan')">Diet Plan</button>
      <button class="chip" onclick="quickSend('Best HIIT workout routine')">HIIT</button>
      <button class="chip" onclick="quickSend('How much protein do I need?')">Protein</button>
      <button class="chip" onclick="quickSend('Home workout no equipment')">Home Workout</button>
      <button class="chip" onclick="quickSend('How important is sleep for fitness?')">Sleep</button>
      <button class="chip" onclick="quickSend('Stretching and mobility tips')">Flexibility</button>
      <button class="chip" onclick="quickSend('How to stay motivated?')">Motivation</button>
      <button class="chip" onclick="quickSend('What supplements should I take?')">Supplements</button>
      <button class="chip" onclick="quickSend('Beginner gym workout plan')">Beginner Guide</button>
      <button class="chip" onclick="quickSend('How to fix my posture and back pain?')">Posture</button>
    </div>

    <div class="sidebar-stats">
      <div class="stat-item">
        <span class="stat-num" id="msgCount">0</span>
        <span class="stat-lbl">Messages</span>
      </div>
      <div class="stat-item">
        <span class="stat-num">40+</span>
        <span class="stat-lbl">Topics</span>
      </div>
    </div>

    <div class="nlp-badge">
      <span class="nlp-dot"></span>
      NLP Engine Active
    </div>
  </aside>

  <main class="chat-container">

    <header class="chat-header">
      <div class="header-left">
        <div class="avatar-ring">
          <div class="bot-avatar">🤖</div>
        </div>
        <div>
          <h1 class="header-title">FitBot</h1>
          <p class="header-sub"> 40+ Topics</p>
        </div>
      </div>
      <button class="clear-btn" onclick="clearChat()" title="Clear chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </header>

    <div class="pipeline-bar">
      <span class="pipe-step" id="pipe1"></span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pipe2"></span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pipe3"></span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pipe4"></span>
    </div>

    <div id="chatbox" class="chatbox"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Ask me anything about fitness…" autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <p class="footer-note">Powered by NLP: tokenisation · stemming · TF-IDF cosine similarity</p>
  </main>

  <script>
    let messageCount = 0;

    window.addEventListener('load', () => {
      appendBot(
        "👋 <b>Hey! I'm FitBot.</b><br>" +
        "I use <b>NLP techniques</b> (tokenisation, stemming & TF-IDF matching) to understand your fitness questions.<br><br>" +
        "Ask me about <b>weight loss, muscle gain, diet, workouts, HIIT, sleep, supplements, injury prevention</b> or pick a topic!"
      );
    });

    function sendMessage() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';

      appendUser(msg);
      animatePipeline();
      showTyping();

      fetch('/get', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'msg=' + encodeURIComponent(msg)
      })
      .then(r => r.json())
      .then(data => {
        removeTyping();
        appendBot(data.reply);
      })
      .catch(() => {
        removeTyping();
        appendBot('⚠️ Connection error. Please ensure the Flask server is running.');
      });
    }

    function quickSend(text) {
      document.getElementById('userInput').value = text;
      sendMessage();
    }

    function appendUser(msg) {
      messageCount++;
      document.getElementById('msgCount').textContent = messageCount;
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = 'msg user-msg';
      div.innerHTML = '<span class="msg-text">' + escapeHtml(msg) + '</span>';
      box.appendChild(div);
      scrollBottom();
    }

    function appendBot(html) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = 'msg bot-msg';
      div.innerHTML =
        '<div class="bot-icon">⚡</div>' +
        '<div class="msg-text">' + html + '</div>';
      box.appendChild(div);
      scrollBottom();
    }

    function showTyping() {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'msg bot-msg typing-msg';
      div.innerHTML =
        '<div class="bot-icon">⚡</div>' +
        '<div class="typing-dots"><span></span><span></span><span></span></div>';
      box.appendChild(div);
      scrollBottom();
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function animatePipeline() {
      const steps = ['pipe1','pipe2','pipe3','pipe4'];
      steps.forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('pipe-active','pipe-done');
        setTimeout(() => {
          el.classList.add('pipe-active');
          setTimeout(() => {
            el.classList.remove('pipe-active');
            el.classList.add('pipe-done');
          }, 300);
        }, i * 280);
      });
    }

    function clearChat() {
      document.getElementById('chatbox').innerHTML = '';
      messageCount = 0;
      document.getElementById('msgCount').textContent = '0';
      appendBot("Chat cleared! Ask me anything about fitness 💪");
    }

    function scrollBottom() {
      const box = document.getElementById('chatbox');
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('userInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendMessage();
      });
    });
  </script>

</body>
</html>
